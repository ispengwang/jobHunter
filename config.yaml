search:
  # 搜索词，逐个跑，结果合并去重
  terms:
  # 全栈开发优先 —— 当前重点求职方向
  - Full Stack Developer
  - Full Stack Engineer
  - Full Stack Software Engineer
  - Junior Full Stack Developer
  - Frontend Developer React
  - Associate Software Engineer
  - Entry Level Software Engineer
  - Graduate Software Engineer
  - Graduate Developer
  # AI / LLM 应用工程作为次级方向，保留与全栈背景相邻的机会
  - Full Stack Developer AI
  - AI Software Engineer
  - AI Engineer
  - AI Product Engineer
  - Generative AI Engineer
  location: "Melbourne VIC"   # 改成 Sydney NSW / Brisbane QLD 等
  country: "australia"
  results_per_term: 50
  hours_old: 336              # 只要 14 天内的岗位（336 小时）
  is_remote: false

sources:
  linkedin: true      # 实测可用
  indeed: true        # 实测可用(hours_old 不传给它,改成抓完按日期自己过滤)
  seek: true          # 实测可用,端点 = jobsearch/v5

  # LinkedIn 限流严重，抓 description 会更慢更容易被封
  linkedin_fetch_description: true
  # 可选代理，格式 "user:pass@host:port" 或 "host:port"
  proxies: []

seek:
  # SEEK 岗位分类：6281 = Information & Communication Technology
  classification: "6281"
  # SEEK 的地区 slug
  # 2026-07-30 由用户确认放宽到整个维州：单一 slug，请求量不随地区数翻倍，
  # 但会带进 Ballarat / Bendigo / Geelong 等远途岗位，打分量随之上升。
  # 想收回墨尔本都会区就改回 "All-Melbourne-VIC"。
  location_slug: "All-Victoria-VIC"
  # 多地区时用列表；一旦启用会覆盖上面的 location_slug。默认保持单地区，
  # 不要在没有确认通勤上限前自行放宽。候选值：
  # All-Victoria-VIC / West-Gippsland-and-Latrobe-Valley-VIC /
  # Mornington-Peninsula-VIC / Geelong-VIC
  # location_slugs: [All-Melbourne-VIC, West-Gippsland-and-Latrobe-Valley-VIC]
  # 请求量 = 搜索词数 × 地区数 × 页数；每 3 小时运行时加地区会等比例放大请求。
  # 保留 seek_source.py 的现有 sleep；若失败，先降低频率，不要删节流。

visa:
  # 你的情况：485 毕业生工签 + 需要后续担保
  status: "485_needs_sponsorship"
  # 命中这些词 → 直接淘汰（硬性排除）
  exclude_keywords:
  - must be an australian citizen
  - australian citizenship is required
  - australian citizenship required
  - citizens only
  - must hold or be able to obtain a security clearance
  - nv1
  - nv2
  - baseline clearance
  - permanent residents only
  - pr only
  - must have full working rights permanently
  - no visa sponsorship
  - unable to provide sponsorship
  - not able to sponsor
  - we do not sponsor
  bonus_keywords:
  - visa sponsorship
  - sponsorship available
  - willing to sponsor
  - '482'
  - tss visa
  - skilled visa
  - we can sponsor
llm:
  # provider: anthropic | openai | deepseek
  # 想用 DeepSeek:改成 "deepseek",export DEEPSEEK_API_KEY=... 就行,
  # 接口是 OpenAI 兼容的,不用额外装包。便宜很多,打分这种量大但不复杂的
  # 任务用它性价比高。
  provider: "deepseek"
  anthropic_model: "claude-sonnet-5"
  openai_model: "gpt-4o"
  # 2026-07-22 核实:DeepSeek 旧模型名 deepseek-chat 即将弃用,用新名字
  deepseek_model: "deepseek-v4-flash"
  # 打分时每批多少个岗位
  batch_size: 8
  # description 截断长度，控制 token 成本
  max_description_chars: 4000

scoring:
  # 以下两项只在显式加 --generate 时才生效,默认流程(打分排序)不用。
  # 分数 >= 这个值才生成简历和 cover letter
  # junior 阶段设 70:大部分 JD 会列一堆"nice to have",
  # 卡 75 会漏掉不少其实可以投的岗位
  generate_threshold: 70
  # 最多生成多少份，防止一次烧太多 token
  max_generate: 15

applypilot:
  # 当前 Codex Agent 加载此 Skill 后连续完成搜索、评分、Dashboard 同步和允许的投递。
  skill_path: "/Users/pengwang/.codex/skills/applypilot-au"
  autonomous: true
  # 平台落点可配置：LinkedIn / Indeed 由 Agent 辅助填写，最终提交始终由用户点击。
  assisted_hosts: [linkedin.com, indeed.com, indeed.com.au]
  # SEEK 原站仍由用户完成平台步骤；未列出的雇主 ATS 走 auto_if_allowed 安全门。
  manual_hosts: [seek.com.au, au.seek.com]
  automation_mode: "light"
  auto_submit_enabled: true
  final_submit_requires_user: true
  timezone: "Australia/Melbourne"
  soft_target_per_day: 30
  platform_limits:
    linkedin: 8
    indeed: 8
    external_ats: 40
  audit_batch_size: 5

application:
  # 岗位发布时间用于日常行动队列，不会删除未知或更早的岗位。
  priority_within_hours: 24
  recent_within_hours: 72
  # 只有 entry/new grad/junior 默认进入自动准备队列，其他级别留给人工审核。
  eligible_seniority_keywords: [graduate, new grad, entry, junior, jnr]
  excluded_seniority_keywords: [senior, staff, principal, lead, manager,
      director]
  # 标题没有级别信号时，JD 要求超过此年限才转人工复核。
  max_years_experience: 2
  # 多份简历时 job-fit 与 resume-fit 都达到 targeted 阈值才走精投；单份简历只看 job-fit。
  targeted_job_fit_threshold: 80
  targeted_resume_fit_threshold: 72
  broad_job_fit_threshold: 70
  # 这里控制 Agent 是否能生成内部执行记录；JobHunter 本身仍不操作招聘网站。
  browser_enabled: true

dedupe:
  # 模糊匹配阈值（0-100），同公司内比较 title
  fuzzy_threshold: 88

paths:
  resume: "profile/resume.md"
  preferences: "profile/preferences.md"
  candidate_profile: "profile/candidate_profile.md"
  resume_manifest: "profile/resumes/manifest.yaml"
  dashboard: "data/application-dashboard.csv"
  application_events: "data/application-events.csv"
  application_attempts: "data/application-attempts.csv"
  scoring_rule_backups: "data/scoring-rule-backups"
  output_dir: "output"
