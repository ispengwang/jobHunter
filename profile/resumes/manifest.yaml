# 每一份简历都必须只包含 Candidate Profile / 原始简历中可证实的事实。
# 新增变体时，把 Markdown 文件放在 profile/resumes/ 下，再在这里加入一项。
resumes:
  - id: resume-default
    path: profile/resume.md
    label: Default resume
    target_roles:
      - Full Stack Developer
      - Full Stack Engineer
      - Full Stack Software Engineer
      - Software Engineer
      - Frontend Developer
      - Graduate Software Engineer
      - AI Software Engineer
      - AI Engineer
      - AI Product Engineer
      - Generative AI Engineer
    keywords:
      - React
      - TypeScript
      - Node.js
      - full-stack
      - AI
      - LLM
    seniority: [graduate, entry, junior]
